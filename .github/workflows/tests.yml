name: Replication checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [fast, numerical]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Run discovered tests
        run: python code/run_tests.py ${{ matrix.group }} --report test-report.json
      - name: Synthetic smoke test
        if: matrix.group == 'fast'
        run: python code/smoke.py --report smoke-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.group }}
          path: "*-report.json"
  public-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Verify bundled file integrity
        run: python code/verify_release.py --exact
      - name: Install dependencies
        run: python -m pip install -r code/requirements.txt
      - name: Rebuild public point estimates with reduced bootstrap settings
        run: python code/check_public_results.py --report public-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-public-data
          path: public-report.json
